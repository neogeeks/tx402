name: Docs

# The documentation site is what the fresh-eyes UX pass reads and what a first-time user
# lands on, so it deploys from `main` rather than only at release: docs that lag the code
# are the failure this is designed against.
#
# The site lives at the **root of `docs.tx402.io`**, its own subdomain, which is why
# `astro.config.mjs` carries no `base` and why `docs/dist` is deployed directly. It was
# served from `tx402.dev/docs` until S15b; that domain was never on Cloudflare.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/tx402/src/**"
      - "tools/docs-gen/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to docs.tx402.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.5"

      # Astro 7 requires Node 22+. The rest of the workspace targets Node 20, which is why
      # this is its own job rather than a step in a matrix leg.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The generated pages are emitted from the package's own exports, so the package has
      # to exist before they can be checked or built.
      - name: Build the SDK
        run: pnpm --filter tx402 build

      - name: Generated pages are current
        run: pnpm docs:check

      - name: Build the site
        run: pnpm docs:build

      # `astro.config.mjs` carries no `base`, so every emitted link is already root-relative
      # and `docs/dist` is the deploy root as-is. The `deploy/docs/` nesting this step used
      # to build existed only because the site was served from `tx402.dev/docs`; keeping it
      # would now put every page at `docs.tx402.io/docs/…`.
      - name: The build produced a deployable root
        run: test -f docs/dist/index.html

      # **A missing token on `main` is a failure, not a skip** (PLAN.md O49). It used to be a
      # notice, so the workflow went green while nothing was published and the Documentation
      # URL both packages advertise stayed dead. On a fork or a branch the build-and-check
      # signal above is still worth having without a red run nobody can fix, so the fail-
      # closed rule is scoped to pushes to `main` on this repository.
      - name: A deploy from main requires the deploy credentials
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured, so docs.tx402.io cannot" \
                 "be published. SPEC §12.4 makes published documentation a release gate;" \
                 "a silent skip here is what let a release ship with dead Documentation URLs."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@4 pages deploy docs/dist \
            --project-name tx402-docs \
            --branch "${GITHUB_REF_NAME}" \
            --commit-dirty=true

      # Deploying is not publishing. The audit found a live deploy behind a registrar
      # redirect that landed on a 404, so the site is read back over the public internet at
      # the URL the packages actually advertise.
      - name: The published site is reachable
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/docs-live/index.js check

      - name: Report when the deploy was skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::Site built and verified, but CLOUDFLARE_API_TOKEN is not set," \
               "so nothing was deployed. This is permitted only off main."
