name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Reproducible builds are a release gate. Pin the toolchain here.
  PNPM_VERSION: "10.34.5"
  NODE_VERSION_DEFAULT: "20"

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC §12.1 compatibility matrix: Node 20 and 22.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Built before lint and typecheck, not after. `examples/typescript` consumes `tx402`
      # exactly as a user does — through the package's emitted declarations — so with no
      # `dist/` every import resolves to `any`, every `no-unsafe-*` rule fires, and the
      # examples fail to typecheck. A local run hides this by inheriting a previous build,
      # which is precisely how it reached CI.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Four raw NUL bytes once reached two adapters and passed every other
      # gate. Git treats such a file as binary, so it cannot be diffed or grepped — the
      # failure is unreviewable source, which no linter looks for.
      - name: No NUL bytes in tracked text files (O25)
        run: pnpm nul-check

      # A workflow is the one file here whose mistakes cannot be found by running it
      # locally. An invalid job-level context rejects the *entire* file before any job is
      # created, which surfaces as a run with zero jobs and no readable error.
      - name: Workflow validity (O37)
        run: pnpm workflow-lint

      # `check` also fails when release-facing prose claims a different vector count from
      # the index, and `selftest` proves that half can fail.
      - name: Conformance index integrity (SEC-007)
        run: |
          pnpm conformance:check
          pnpm conformance:selftest

      - name: Release manifest signature (SEC-007)
        run: pnpm manifest:verify

      # These falsifiability self-tests prove each supply-chain / adversarial / durable-store /
      # toolchain guard can actually FAIL on a seeded regression. Before S13d they ran only in
      # release.yml's `pnpm check` (tag time), so per-commit CI never exercised them. All are
      # pure-logic (no Redis/DO/network), so they belong on every push — the guards protect release
      # gates, and a broken guard should be caught the commit it breaks, not at the tag.
      - name: Falsifiability self-tests (O28/O29/O31/O32)
        run: |
          pnpm supply-chain:selftest
          pnpm adversarial:selftest
          pnpm durable:selftest
          pnpm toolchain:selftest

      # Diagnostic: an intermittent failure in this suite could not be reproduced locally,
      # and job logs are not readable without admin rights on the repository. Emitting the
      # failing lines as workflow annotations surfaces them through the checks API, which is
      # readable. Remove once the cause is settled.
      - name: Test
        run: |
          set -o pipefail
          if ! pnpm test 2>&1 | tee /tmp/vitest.log; then
            echo "::error::pnpm test failed — first failure lines follow"
            grep -E "FAIL|AssertionError|Error:|timed out|Hook timed out" /tmp/vitest.log \
              | head -25 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Coverage thresholds (SPEC §12.1)
        run: pnpm --filter tx402 exec vitest run --coverage

      - name: Size gate (ADR-008)
        run: pnpm size

      # The error reference and the API surface page are emitted from shipped source. A
      # taxonomy or exit-code change that is not regenerated would leave the published docs
      # claiming a code the binary does not return.
      - name: Generated docs are current
        run: pnpm docs:check

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tx402-python
    strategy:
      fail-fast: false
      matrix:
        # SPEC §12.1 compatibility matrix: CPython 3.10-3.13.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # v9 changed the default to false; retain the prior cache-footprint behavior.
          prune-cache: true

      - name: Sync (locked)
        run: uv sync --all-extras --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # Coverage thresholds are enforced through pytest addopts.
      - name: Test
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

  # Linux-only was defensible while nothing in the SDK touched a path or a
  # shell: the CLI changed that. `--body @file` reads from disk, the console script is
  # resolved by the platform's launcher, and line endings differ — so the CLI and the
  # package contract are exercised on all three platforms before release. The full matrix
  # stays on Linux; these legs answer "does it work at all off Linux", which is the
  # question that was actually open.
  cross-platform:
    # The Node version is not interpolated into this name. A job-level `name` may only read
    # the github/needs/strategy/matrix/vars/inputs contexts — `env` is not among them, and
    # using it is an *invalid workflow* rather than an empty string: the run completes as a
    # failure with zero jobs, which looks nothing like a syntax error and cost one red run
    # to identify. Keep literals here and let the steps read `env`.
    name: ${{ matrix.os }} (Node 20, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: TypeScript suite
        run: pnpm --filter tx402 test

      - name: CLI smoke (resolves and exits per SPEC §11)
        shell: bash
        run: |
          set -uo pipefail
          node packages/tx402/dist/cli/index.js --version
          node packages/tx402/dist/cli/index.js --help
          # An unknown command must exit 2 on every platform, not merely fail. Captured
          # explicitly rather than through `&& exit 1`, which under `set -e` fails the step
          # on the *expected* non-zero status and so asserts nothing.
          node packages/tx402/dist/cli/index.js nonsense && code=0 || code=$?
          echo "unknown command exited $code"
          test "$code" -eq 2

      - name: Python suite
        working-directory: packages/tx402-python
        run: |
          uv sync --all-extras --python 3.12
          uv run pytest -q

      - name: Python CLI smoke
        working-directory: packages/tx402-python
        shell: bash
        run: |
          uv run tx402 --version
          uv run tx402 --help

  # The documentation site. Astro requires Node 22+, which is why this is its own job
  # rather than a step in the Node 20 matrix leg. Building it in CI is what keeps a broken
  # MDX page or a dead internal link from reaching the published site.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs here because this is the only job on the runtime the aggregate local gate
      # declares. It checks that the workspace floor, the docs package, the installed
      # Astro, the published SDK floor and this workflow's own Node matrix still describe
      # one coherent contract.
      - name: Toolchain contract
        run: |
          pnpm toolchain:check
          pnpm toolchain:selftest

      # The generated pages are built from the package's own exports, so the package has to
      # exist before they can be checked.
      - name: Build the SDK
        run: pnpm --filter tx402 build

      - name: Generated pages are current
        run: pnpm docs:check

      - name: Build the site
        run: pnpm docs:build

  # Cross-language parity is a release gate. Both SDKs execute the
  # same vectors from core-spec/conformance; this job runs the two suites side by side so a
  # parity break is reported as one failure rather than two unrelated ones.
  conformance:
    name: Conformance parity (TS ↔ Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Conformance index integrity
        run: pnpm conformance:check

      # Diagnostic: an intermittent failure in this suite could not be reproduced locally,
      # and job logs are not readable without admin rights on the repository. Emitting the
      # failing lines as workflow annotations surfaces them through the checks API, which is
      # readable. Remove once the cause is settled.
      - name: TypeScript conformance + package contract
        run: |
          set -o pipefail
          if ! pnpm --filter tx402 test 2>&1 | tee /tmp/vitest.log; then
            echo "::error::TypeScript suite failed — first failure lines follow"
            grep -E "FAIL|AssertionError|Error:|timed out|Hook timed out" /tmp/vitest.log \
              | head -25 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Python conformance + package contract
        working-directory: packages/tx402-python
        run: |
          uv sync --all-extras
          uv run pytest -q

      # 0.2.0 SpendStore contract twins, invocable in both languages.
      # Runs `python -m tx402.spend_store_contract` (the real entry point that replaced the
      # zero-check no-op) and the TS `checkSpendStore` twin against MemorySpendStore v2, so the
      # single-plane contract has a stable root script, not a prose-only job name (§14). The
      # durable harness runs from the durable-store job at S7/S8.
      - name: SpendStore contract suites (both languages)
        run: pnpm contract:check

  # 0.2.0 durable-store gate. REAL as of S7a; grew the S7b governance arms.
  # `pnpm durable:check redis` PINGs the backends and runs `checkDurableSpendStore` /
  # `check_durable_spend_store` across all four adapter arms (TS ioredis + node-redis, Python sync
  # + async) — backend-clock skew, cross-connection locator, cumulative cap, exposure, true-parallel
  # atomicity, plane separation, PLUS S7b's governance (freeze with the capability-parameterized
  # global arm, pins, administered limits), the persistence-disabled warning, and the raw Redis ACL
  # data/admin split — on a STANDALONE AOF instance, a real 3-master CLUSTER
  # (`atomicGlobalFreeze:false`), and a dedicated AOF instance the tests RESTART (`_check_restart`).
  # Instead of the service container (no AOF, no Cluster) the job installs Redis from apt and
  # launches all of it; ubuntu-24.04 ships Redis 7.0.x — the SPEC §12.2 floor (EVAL/TIME-in-atom,
  # ACL DRYRUN; no 7.4-only HEXPIRE). S8 adds the Durable Object.
  durable-store:
    name: Durable store (Redis 7)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}

      # ioredis + node-redis (optional peers) and vitest come from the workspace install; the redis
      # suite runs from source, so no `pnpm build` is needed for it.
      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # redis-py (sync + asyncio) is in the dev group, so the default sync covers the Python arm.
      - name: Sync (uv)
        run: uv sync --all-extras
        working-directory: packages/tx402-python

      # Standalone (AOF, for the persistence arm + the durable suite) + a 3-master Cluster
      # (atomicGlobalFreeze:false). The restart arm spawns its own dedicated AOF instance and needs
      # `redis-server` on PATH, which apt provides.
      - name: Install and launch Redis (standalone AOF + 3-master Cluster)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          redis-server --version
          # apt auto-starts a systemd Redis on :6379 WITHOUT AOF; stop it so our AOF instance owns
          # the port (else our launch fails to bind and the tests hit the non-AOF systemd server).
          sudo systemctl disable --now redis-server 2>/dev/null || true
          sudo service redis-server stop 2>/dev/null || true
          sudo pkill -x redis-server 2>/dev/null || true
          sleep 1
          redis-server --daemonize yes --appendonly yes --port 6379 \
            --dir "$RUNNER_TEMP" --pidfile "$RUNNER_TEMP/redis-standalone.pid" \
            --logfile "$RUNNER_TEMP/redis-standalone.log"
          for p in 7001 7002 7003; do
            mkdir -p "$RUNNER_TEMP/cluster-$p"
            redis-server --daemonize yes --port "$p" --cluster-enabled yes \
              --cluster-config-file "$RUNNER_TEMP/cluster-$p/nodes.conf" \
              --cluster-node-timeout 5000 --appendonly yes --dir "$RUNNER_TEMP/cluster-$p" \
              --pidfile "$RUNNER_TEMP/cluster-$p/redis.pid" \
              --logfile "$RUNNER_TEMP/cluster-$p/redis.log"
          done
          for port in 6379 7001 7002 7003; do
            for _ in $(seq 1 40); do
              redis-cli -p "$port" ping 2>/dev/null | grep -q PONG && break
              sleep 0.5
            done
          done
          # Fail loudly if the standalone did not come up with AOF on (e.g. the port was still held).
          test "$(redis-cli -p 6379 config get appendonly | tail -1)" = "yes"
          yes yes | redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-yes
          redis-cli -p 7001 cluster info | grep cluster_state

      # One stable script runs both languages against every arm (§14): TS ioredis + node-redis via
      # vitest, then Python sync + async via pytest — standalone, Cluster, and AOF restart.
      - name: Redis reachable + durable suite (TS + Python)
        run: pnpm durable:check redis
        env:
          TX402_TEST_REDIS_URL: redis://localhost:6379
          TX402_TEST_REDIS_CLUSTER: 127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
          TX402_TEST_REDIS_RESTART: "1"

  # 0.2.0 Durable Object gate. REAL as of S8. Runs in a LOCAL Workers
  # runtime (workerd via @cloudflare/vitest-pool-workers ~0.12, compatible with the repo's Vitest
  # ^2.1 — O8) — no Cloudflare account, no network. `pnpm durable:check do` runs the whole
  # checkDurableSpendStore on BOTH topologies (id-per-scope → the incapable global-freeze arm;
  # single-coordinator → the capable arm), plus the single-plane checkSpendStore twin, admin-token
  # denial, fail-closed overload, and a local throughput baseline. The pool's workerd platform
  # binary comes from the optional dep + its install script (onlyBuiltDependencies).
  durable-object:
    name: Durable Object (local Workers runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          # The Workers test pool prefers a current Node; the DO suite runs the runtime on Node 22.
          node-version: "22"

      # Installs @cloudflare/vitest-pool-workers + wrangler/miniflare + the workerd platform binary
      # (no build needed — Vite transforms the DO source in the pool).
      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - name: DO harness (checkDurableSpendStore, both topologies)
        run: pnpm durable:check do

  # 0.2.0 capability-gateway golden. REAL as of S9. It (1) drift-checks the
  # committed wire golden (`pnpm gateway:golden`, importing the built client), and (2) runs the whole
  # `checkDurableSpendStore` BEHIND the reference gateways over BOTH backends from BOTH clients — TS
  # + Python over Redis (the Node gateway, `serve-redis.mjs`) and over the Durable Object (the Worker
  # gateway served by a local Workers runtime via miniflare, `serve-do.mjs`, no Cloudflare account).
  # The TS-over-DO arm runs in the `durable-object` job (its vitest config includes the gateway DO
  # suite); this job covers the golden, TS-over-Redis, and Python-over-both.
  gateway-golden:
    name: Gateway golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          # miniflare/workerd (the served DO gateway) + the DO pool run on Node 22.
          node-version: "22"

      # miniflare + esbuild (the served DO gateway) come from the workspace install; the built
      # client/adapters back the golden tool and the Node Redis gateway launcher.
      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync (uv)
        run: uv sync --all-extras
        working-directory: packages/tx402-python

      # A standalone AOF Redis 7 on :6379 for the Redis-backed gateway arms (the gateway fronts it;
      # ubuntu-24.04 ships 7.0.x, the SPEC §12.2 floor). Stop the apt-autostarted non-AOF instance so
      # ours owns the port, mirroring the durable-store job.
      - name: Install and launch Redis (standalone AOF)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          sudo systemctl disable --now redis-server 2>/dev/null || true
          sudo service redis-server stop 2>/dev/null || true
          sudo pkill -x redis-server 2>/dev/null || true
          sleep 1
          redis-server --daemonize yes --appendonly yes --port 6379 \
            --dir "$RUNNER_TEMP" --pidfile "$RUNNER_TEMP/redis-gateway.pid" \
            --logfile "$RUNNER_TEMP/redis-gateway.log"
          for _ in $(seq 1 40); do
            redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && break
            sleep 0.5
          done
          test "$(redis-cli -p 6379 config get appendonly | tail -1)" = "yes"

      # dist backs the golden tool + the Node Redis gateway launcher (serve-redis.mjs imports it).
      - name: Build distributions
        run: pnpm build

      - name: Gateway wire golden (drift check)
        run: pnpm gateway:golden

      - name: Gateway conformance — TS client over Redis
        run: pnpm -C packages/tx402 exec vitest run test/gateway-store.test.ts test/gateway-golden.test.ts
        env:
          TX402_TEST_REDIS_URL: redis://localhost:6379

      - name: Gateway conformance — Python client over Redis + DO
        run: uv run pytest tests/test_gateway_store.py tests/test_gateway_durable.py --no-cov -q
        working-directory: packages/tx402-python
        env:
          # The behind-gateway arms are opt-in (they spawn a Node gateway + a miniflare-served DO on
          # Node 22); this is the one job provisioned for them, so it turns them on.
          TX402_TEST_GATEWAY: "1"
          TX402_TEST_REDIS_URL: redis://localhost:6379

  # SPEC §12.4 release gates that are cheap enough to run on every push. Kept in one job
  # rather than folded into the TypeScript matrix leg: these are release evidence, and a
  # release gate that only ran as a side effect of a compatibility leg is hard to point at
  # when someone asks whether it passed.
  release-gates:
    name: Release gates (fuzz, perf, supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # SPEC §12.1's fuzz/property layer. Seeded, so a failure here reproduces exactly: the
      # run prints the seed and the command that replays it.
      - name: Fuzz and property gates
        run: pnpm fuzz
        env:
          TX402_FUZZ_N: "200000"

      # PRD-phase1 §27's unified adversarial driver: concurrency, store failure, signer
      # failure, budget exhaustion, freeze, recipient pinning and exposure composed in one
      # deterministic, offline run (three localhost servers, no testnet, no funds).
      - name: Adversarial driver
        run: pnpm adversarial

      # SPEC §12.3. `--expose-gc` is what makes the memory gate a measurement rather than a
      # skip: retained heap can only be compared after a forced collection.
      - name: Performance gates
        run: pnpm perf

      - name: Python environment for the SBOM
        working-directory: packages/tx402-python
        run: uv sync --all-extras

      # SBOM, licence policy, and vulnerability scan. Findings in the development tree are
      # reported and do not fail the gate — SPEC §12.4 scopes it to reachable production
      # code, and vitest cannot reach a user.
      - name: SBOM, licences, vulnerabilities
        run: pnpm supply-chain

      # Two clean builds of the published package must be byte-identical.
      - name: Reproducible build
        run: pnpm reproducible

      # Every documented npm install, packed and installed into an empty directory outside
      # the workspace, with every entry point it advertises imported. This
      # needs a network and the built artifact, which is why it lives here rather than in
      # `pnpm check`.
      - name: Documented installs load their entry points
        run: pnpm install-smoke

      - name: Upload SBOM and build digest
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
